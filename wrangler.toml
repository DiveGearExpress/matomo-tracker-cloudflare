routes = [
  { pattern = "www.divegearexpress.com/matomo-ai-test*", zone_name = "divegearexpress.com" }
]
name = "matomo-tracker-cloudflare"
main = "dist/index.js"
compatibility_date = "2024-12-08"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[build]
command = "npm run build"

[dev]
port = 8787
local_protocol = "https"

[vars]
MATOMO_URL = "https://www.divegearexpress.com/matomo"
MATOMO_SITE_ID = "1"
MATOMO_TIMEOUT_MS = "5000"
LOG_LEVEL = "warn"
USER_AGENT_ALLOWLIST_REGEX = ""
DOCUMENT_REGEX = ""
